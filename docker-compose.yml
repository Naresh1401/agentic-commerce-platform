services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
      POSTGRES_DB: commerce
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://commerce:commerce@postgres:5432/commerce
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  mcp-server:
    build: ./mcp-server
    environment:
      MCP_BACKEND_URL: http://backend:8000
      PARTNER_API_KEY: demo_partner_key
    ports:
      - "8010:8010"
    depends_on:
      - backend

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  agents:
    build: ./agents
    environment:
      API_BASE_URL: http://backend:8000
      LLM_MODE: mock
    profiles: ["agents"]
    depends_on:
      - backend
